on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      ##- run: npm ci
      ##- run: npm test
      - run: npm run build
      - run: npm publish
        # Required ONLY for the new package.
        # Set Trusted Publishing after first-time publish
        # and comment out the below.
        #env:
        #  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
